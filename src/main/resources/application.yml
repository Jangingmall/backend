spring:
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 120MB

server:
  shutdown: graceful
  tomcat:
    max-part-count: 50

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        live:
          additional-path: "server:/healthz"
          include: ping
  metrics:
    tags:
      application: ${spring.application.name:backend}

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test-secret-key-local}
    client-key: ${TOSS_CLIENT_KEY:test-client-key-local}
    base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    order-expiration-seconds: ${PAYMENT_ORDER_EXPIRATION_SECONDS:1800}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://stg.midam.store,https://midam.store}

delivery:
  sweet-tracker:
    api-key: ${SWEET_TRACKER_API_KEY:}
    base-url: ${SWEET_TRACKER_API_BASE_URL:https://info.sweettracker.co.kr}

image:
  base-url: ${IMAGE_BASE_URL:}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

---
spring:
  config:
    activate:
      on-profile: local-postgresql
  datasource:
    url: jdbc:postgresql://localhost:5432/jangingmall
    username: jangingmall
    password: jangingmall
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql,classpath:data-sequence-reset.sql
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: local-kakao-client-id
            client-secret: local-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: local-dev-secret-key-minimum-256-bits-for-hs256-algorithm
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: false

member:
  oauth:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/oauth/callback}
    http-timeout-millis: ${OAUTH_HTTP_TIMEOUT_MILLIS:5000}
  rate-limit:
    attempts: ${MEMBER_RATE_LIMIT_ATTEMPTS:10}
    window-seconds: ${MEMBER_RATE_LIMIT_WINDOW_SECONDS:60}

image:
  base-url: ${IMAGE_BASE_URL:}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET:}
    return-bucket: ${IMAGE_RETURN_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    unused-retention-seconds: ${IMAGE_UNUSED_RETENTION_SECONDS:86400}
    max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

ai:
  chat-bot-url: ${AI_CHAT_BOT_URL:http://localhost:8001}
  content-url: ${AI_CONTENT_URL:http://localhost:8002}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:300}
  internal-auth-token: ${AI_INTERNAL_AUTH_TOKEN:}
  generation:
    deadline-seconds: ${GENERATION_DEADLINE_SECONDS:1861}
    scan-millis: ${GENERATION_POLL_SCAN_MILLIS:60000}

internal-api:
  backend-auth-token: ${BACKEND_AUTH_TOKEN:}

revalidate:
  webhook-url: ${REVALIDATE_WEBHOOK_URL:http://localhost:3000/api/revalidate}
  webhook-secret: ${REVALIDATE_WEBHOOK_SECRET:}
  timeout-seconds: ${REVALIDATE_TIMEOUT_SECONDS:10}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:jangingmall;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: local-kakao-client-id
            client-secret: local-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: local-h2-secret-key-minimum-256-bits-for-hs256-algorithm
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: false

member:
  oauth:
    frontend-redirect-url: http://localhost:3000/oauth/callback
    http-timeout-millis: 5000
  rate-limit:
    attempts: 10
    window-seconds: 60

image:
  base-url: ${IMAGE_BASE_URL:}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET:}
    return-bucket: ${IMAGE_RETURN_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    unused-retention-seconds: ${IMAGE_UNUSED_RETENTION_SECONDS:86400}
    max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

ai:
  chat-bot-url: ${AI_CHAT_BOT_URL:http://localhost:8001}
  content-url: ${AI_CONTENT_URL:http://localhost:8002}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:300}
  internal-auth-token: ${AI_INTERNAL_AUTH_TOKEN:}
  generation:
    deadline-seconds: ${GENERATION_DEADLINE_SECONDS:1861}
    scan-millis: ${GENERATION_POLL_SCAN_MILLIS:60000}

internal-api:
  backend-auth-token: ${BACKEND_AUTH_TOKEN:}

revalidate:
  webhook-url: ${REVALIDATE_WEBHOOK_URL:https://stg.midam.store/api/revalidate}
  webhook-secret: ${REVALIDATE_WEBHOOK_SECRET:}
  timeout-seconds: ${REVALIDATE_TIMEOUT_SECONDS:10}

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

toss:
  payments:
    # Production-like deployments must receive real payment credentials from the secret store.
    # The root defaults remain available only to local profiles.
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: true

member:
  oauth:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL}
    http-timeout-millis: ${OAUTH_HTTP_TIMEOUT_MILLIS:5000}
  rate-limit:
    attempts: ${MEMBER_RATE_LIMIT_ATTEMPTS:10}
    window-seconds: ${MEMBER_RATE_LIMIT_WINDOW_SECONDS:60}

image:
  base-url: ${IMAGE_BASE_URL}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET}
    return-bucket: ${IMAGE_RETURN_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    unused-retention-seconds: ${IMAGE_UNUSED_RETENTION_SECONDS:86400}
    max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

ai:
  chat-bot-url: ${AI_CHAT_BOT_URL}
  content-url: ${AI_CONTENT_URL}
  timeout-seconds: 300
  internal-auth-token: ${AI_INTERNAL_AUTH_TOKEN}
  generation:
    deadline-seconds: ${GENERATION_DEADLINE_SECONDS:1861}
    scan-millis: ${GENERATION_POLL_SCAN_MILLIS:60000}

internal-api:
  backend-auth-token: ${BACKEND_AUTH_TOKEN}

revalidate:
  webhook-url: ${REVALIDATE_WEBHOOK_URL}
  webhook-secret: ${REVALIDATE_WEBHOOK_SECRET}
  timeout-seconds: ${REVALIDATE_TIMEOUT_SECONDS:10}

logging:
  structured:
    format:
      console: ecs
