spring:
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/jangingmall
    username: jangingmall
    password: jangingmall
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: local-kakao-client-id
            client-secret: local-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
          google:
            client-id: local-google-client-id
            client-secret: local-google-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: openid, profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: local-dev-secret-key-minimum-256-bits-for-hs256-algorithm
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: false

member:
  email-verification:
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/member/email-verifications/verify}
    success-redirect-url: ${EMAIL_VERIFICATION_SUCCESS_REDIRECT:http://localhost:3000/}
    from: ${MAIL_FROM:no-reply@jangingmall.local}
    token-expiry-seconds: 1800
  oauth:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/oauth/callback}
    http-timeout-millis: ${OAUTH_HTTP_TIMEOUT_MILLIS:5000}
  rate-limit:
    attempts: ${MEMBER_RATE_LIMIT_ATTEMPTS:10}
    window-seconds: ${MEMBER_RATE_LIMIT_WINDOW_SECONDS:60}

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:}
    client-key: ${TOSS_CLIENT_KEY:}
    base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    order-expiration-seconds: ${PAYMENT_ORDER_EXPIRATION_SECONDS:1800}

delivery:
  sweet-tracker:
    api-key: ${SWEET_TRACKER_API_KEY:}
    base-url: ${SWEET_TRACKER_API_BASE_URL:https://info.sweettracker.co.kr}

image:
  base-url: ${IMAGE_BASE_URL:}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

ai:
  base-url: ${AI_BASE_URL:}
  timeout-seconds: 30

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: openid, profile, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: true

member:
  email-verification:
    verification-url: ${EMAIL_VERIFICATION_URL}
    success-redirect-url: ${EMAIL_VERIFICATION_SUCCESS_REDIRECT}
    from: ${MAIL_FROM}
    token-expiry-seconds: ${EMAIL_VERIFICATION_TTL_SECONDS:1800}
  oauth:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL}
    http-timeout-millis: ${OAUTH_HTTP_TIMEOUT_MILLIS:5000}
  rate-limit:
    attempts: ${MEMBER_RATE_LIMIT_ATTEMPTS:10}
    window-seconds: ${MEMBER_RATE_LIMIT_WINDOW_SECONDS:60}

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}
    base-url: ${TOSS_API_BASE_URL:https://api.tosspayments.com}
    order-expiration-seconds: ${PAYMENT_ORDER_EXPIRATION_SECONDS:1800}

delivery:
  sweet-tracker:
    api-key: ${SWEET_TRACKER_API_KEY}
    base-url: ${SWEET_TRACKER_API_BASE_URL:https://info.sweettracker.co.kr}

image:
  base-url: ${IMAGE_BASE_URL}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

ai:
  base-url: ${AI_BASE_URL}
  timeout-seconds: 30
