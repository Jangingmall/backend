spring:
  profiles:
    active: local

server:
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        live:
          additional-path: "server:/healthz"
          include: ping
  metrics:
    tags:
      application: ${spring.application.name:backend}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/jangingmall
    username: jangingmall
    password: jangingmall
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: local-kakao-client-id
            client-secret: local-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
          naver:
            client-id: ${NAVER_CLIENT_ID:local-naver-client-id}
            client-secret: ${NAVER_CLIENT_SECRET:local-naver-client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: local-dev-secret-key-minimum-256-bits-for-hs256-algorithm
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: false

member:
  email-verification:
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/member/email-verifications/verify}
    success-redirect-url: ${EMAIL_VERIFICATION_SUCCESS_REDIRECT:http://localhost:3000/}
    from: ${MAIL_FROM:no-reply@jangingmall.local}
    token-expiry-seconds: 1800
  oauth:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/oauth/callback}
    http-timeout-millis: ${OAUTH_HTTP_TIMEOUT_MILLIS:5000}
  rate-limit:
    attempts: ${MEMBER_RATE_LIMIT_ATTEMPTS:10}
    window-seconds: ${MEMBER_RATE_LIMIT_WINDOW_SECONDS:60}

ai:
  base-url: http://localhost:8001
  timeout-seconds: 30

---
