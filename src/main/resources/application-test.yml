spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/jangingmall
    driver-class-name: org.postgresql.Driver
    username: jangingmall
    password: jangingmall
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image, mobile
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: test-secret-key-minimum-256-bits-for-hs256-algorithm-padding
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: false

member:
  oauth:
    frontend-redirect-url: http://localhost:3000/oauth/callback
    http-timeout-millis: 5000
  rate-limit:
    attempts: 10
    window-seconds: 60

image:
  base-url: ${IMAGE_BASE_URL:}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET:}
    return-bucket: ${IMAGE_RETURN_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    unused-retention-seconds: ${IMAGE_UNUSED_RETENTION_SECONDS:86400}
    max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8001}
  content-base-url: ${AI_CONTENT_BASE_URL:}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:300}
  internal-auth-token: ${AI_INTERNAL_AUTH_TOKEN:}
  generation:
    deadline-seconds: ${GENERATION_DEADLINE_SECONDS:1861}
    scan-millis: ${GENERATION_POLL_SCAN_MILLIS:60000}

internal-api:
  backend-auth-token: ${BACKEND_AUTH_TOKEN:}

revalidate:
  webhook-url: ${REVALIDATE_WEBHOOK_URL:https://stg.midam.store/api/revalidate}
  webhook-secret: ${REVALIDATE_WEBHOOK_SECRET:}
  timeout-seconds: ${REVALIDATE_TIMEOUT_SECONDS:10}
