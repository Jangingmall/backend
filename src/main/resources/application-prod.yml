spring:
  mail:
    port: ${MAIL_PORT:587}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 900000
      leak-detection-threshold: 5000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image, mobile
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    client-key: ${TOSS_CLIENT_KEY}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000
  refresh-token-expiry: 604800000
  refresh-cookie-secure: true

member:
  oauth:
    frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL}
    http-timeout-millis: ${OAUTH_HTTP_TIMEOUT_MILLIS:5000}
  rate-limit:
    attempts: ${MEMBER_RATE_LIMIT_ATTEMPTS:10}
    window-seconds: ${MEMBER_RATE_LIMIT_WINDOW_SECONDS:60}

image:
  base-url: ${IMAGE_BASE_URL}
  storage:
    bucket: ${IMAGE_UPLOAD_BUCKET}
    return-bucket: ${IMAGE_RETURN_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_STORAGE_KEY_PREFIX:images}
    presign-expiry-seconds: ${IMAGE_PRESIGN_EXPIRY_SECONDS:300}
    unused-retention-seconds: ${IMAGE_UNUSED_RETENTION_SECONDS:86400}
    max-file-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10485760}
    cleanup-scan-millis: ${IMAGE_CLEANUP_SCAN_MILLIS:60000}

ai:
  base-url: ${AI_BASE_URL}
  content-base-url: ${AI_CONTENT_BASE_URL}
  timeout-seconds: 300
  internal-auth-token: ${AI_INTERNAL_AUTH_TOKEN}
  generation:
    deadline-seconds: ${GENERATION_DEADLINE_SECONDS:1861}
    scan-millis: ${GENERATION_POLL_SCAN_MILLIS:60000}

internal-api:
  backend-auth-token: ${BACKEND_AUTH_TOKEN}

revalidate:
  webhook-url: ${REVALIDATE_WEBHOOK_URL}
  webhook-secret: ${REVALIDATE_WEBHOOK_SECRET}
  timeout-seconds: ${REVALIDATE_TIMEOUT_SECONDS:10}

dast:
  user:
    email: ${DAST_USER_EMAIL:}
    password: ${DAST_USER_PASSWORD:}
  artisan:
    email: ${DAST_ARTISAN_EMAIL:}
    password: ${DAST_ARTISAN_PASSWORD:}
  admin:
    email: ${DAST_ADMIN_EMAIL:}
    password: ${DAST_ADMIN_PASSWORD:}

logging:
  structured:
    format:
      console: ecs
