plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.20.1'
}

group = 'com.jangingmall'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Security & OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // REST Docs + OpenAPI spec generation
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

// ── REST Docs 스니펫 출력 경로 ────────────────────────────────────────────────
def snippetsDir = layout.buildDirectory.dir('generated-snippets')

tasks.named('test') {
    outputs.dir(snippetsDir)
    useJUnitPlatform()
}

// ── OpenAPI 3.0 JSON 생성 (restdocs-api-spec) ────────────────────────────────
openapi3 {
    server = 'http://localhost:8080'
    title = '장인몰 (미담) API'
    description = '국가무형유산 장인 B2C 마켓플레이스 REST API'
    version = project.version
    format = 'json'
    outputDirectory = 'build/api-spec'
    outputFileNamePrefix = 'openapi'
}

// ── 후처리: 공백·개행 정규화 + 샘플 데이터 주입 ─────────────────────────────
tasks.register('processOpenapi') {
    dependsOn 'openapi3'
    description = 'Pretty-print openapi.json and inject x-sample-data extensions'

    def inputFile  = file('build/api-spec/openapi.json')
    def outputFile = file('api-spec/openapi.json')

    inputs.file(inputFile)
    outputs.file(outputFile)

    doLast {
        def json = new groovy.json.JsonSlurper().parse(inputFile)

        // x-sample-data 최상위 extension 주입
        json['x-sample-data'] = [
            member   : [email: 'artisan@example.com', name: '김도공'],
            product  : [title: '청자 상감 다완', price: 85000, category: 'POTTERY'],
            chatbot  : [message: '어머니 생신 선물 추천해줘', sessionKey: 'sess-abc123']
        ]

        def outputDir = file('api-spec')
        outputDir.mkdirs()
        outputFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(json)
        )

        println "[processOpenapi] 생성 완료: ${outputFile.absolutePath}"
    }
}

// ── Redocly HTML 생성 ────────────────────────────────────────────────────────
tasks.register('buildRedocly', Exec) {
    dependsOn 'processOpenapi'
    description = 'Generate Redocly static HTML from api-spec/openapi.json'

    def specFile  = file('api-spec/openapi.json')
    def outputHtml = file('api-spec/redoc.html')

    inputs.file(specFile)
    outputs.file(outputHtml)

    commandLine 'npx', '--yes', '@redocly/cli', 'build-docs',
        specFile.absolutePath,
        '--output', outputHtml.absolutePath

    doLast {
        println "[buildRedocly] HTML 생성 완료: ${outputHtml.absolutePath}"
    }
}
