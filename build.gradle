buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.flywaydb:flyway-gradle-plugin:13.8.1'
        classpath 'org.flywaydb:flyway-database-postgresql:13.8.1'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.20.1'
    // id 'io.gatling.gradle' version '3.13.5'  // Gradle 9.x 호환성 문제로 k6로 대체
    id 'jacoco'
}

// Flyway plugin 적용 (buildscript classpath에서 로드)
apply plugin: 'org.flywaydb.flyway'

group = 'com.jangingmall'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Security & OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // Database
    runtimeOnly 'org.postgresql:postgresql:42.7.13'
    runtimeOnly 'com.h2database:h2'

    // Flyway
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // AWS S3 (Presigned PUT image upload)
    implementation platform('software.amazon.awssdk:bom:2.54.13')
    implementation 'software.amazon.awssdk:s3'

    // Observability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // REST Docs + OpenAPI spec generation
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Testcontainers
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.1')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // dotenv — 루트 .env 파일을 Spring 환경변수로 로드 (로컬 개발용)
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Email
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Gatling load test (k6로 대체 — Gradle 9.x 호환성)
    // gatlingImplementation 'io.gatling.highcharts:gatling-charts-highcharts:3.13.5'
}

// Flyway Gradle plugin configuration
// flywayClean task을 위한 설정 — 환경변수(DB_URL, DB_USERNAME, DB_PASSWORD) 사용
// 인프라에서 SSM → 환경변수 주입, 코드에서는 단순 환경변수 읽기만 수행
flyway {
    url = System.getenv('DB_URL')
    user = System.getenv('DB_USERNAME')
    password = System.getenv('DB_PASSWORD')
    schemas = ['public']
    // 기본적으로 clean 비활성화 — prod 실행 중 실수 방지
    // flywayClean task 실행 시에만 clean 허용
    cleanDisabled = true
}

// flywayClean task에서만 clean 허용
tasks.named('flywayClean') {
    cleanDisabled = false
}

def querydslDir = layout.buildDirectory.dir("generated/querydsl").get().asFile

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.getGeneratedSourceOutputDirectory().set(querydslDir)
}

// ── REST Docs 스니펫 출력 경로 ────────────────────────────────────────────────
def snippetsDir = layout.buildDirectory.dir('generated-snippets')

tasks.named('test') {
    outputs.dir(snippetsDir)
    useJUnitPlatform {
        excludeTags 'e2e', 'prod-smoke', 'ai-health', 'dast-infra'
    }
    exclude '**/content/**'
    jvmArgs '-Xmx768m', '-XX:+UseG1GC'
    outputs.upToDateWhen { false }
    finalizedBy 'buildRedocly', 'jacocoTestReport'
}

tasks.register('aiContentTest', Test) {
    description = 'Runs AI content generation tests only.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'e2e', 'prod-smoke', 'ai-health', 'dast-infra'
    }
    include '**/content/**'
    outputs.dir(snippetsDir)
    outputs.upToDateWhen { false }
    jvmArgs '-Xmx768m', '-XX:+UseG1GC'
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/global/config/**',
                    '**/global/common/**',
                    '**/*Request.*',
                    '**/*Response.*',
                    '**/*Command.*',
                    '**/dto/**',
                    '**/domain/**',
            ])
        }))
    }
}

tasks.register('e2eTest', Test) {
    description = 'Runs E2E integration tests requiring PostgreSQL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'e2e'
    }
    outputs.dir(snippetsDir)
    shouldRunAfter 'test'
}

apply from: 'gradle/documentation.gradle'
apply from: 'gradle/local.gradle'
apply from: 'gradle/prod-smoke.gradle'
apply from: 'gradle/ai-health.gradle'
apply from: 'gradle/security.gradle'