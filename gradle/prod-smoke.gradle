// prod 프로필 smoke test
// PostgreSQL Testcontainer 위에서 Flyway 마이그레이션 + ApplicationContext 기동을 검증한다.
// 사용: ./gradlew prodSmokeTest
tasks.register('prodSmokeTest', Test) {
    group = 'verification'
    description = 'PostgreSQL 컨테이너로 Flyway 마이그레이션과 prod ApplicationContext 기동을 검증합니다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'prod-smoke'
    }
    shouldRunAfter 'test'
}
