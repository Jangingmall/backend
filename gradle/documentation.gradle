// ── OpenAPI 3.0 JSON 생성 (restdocs-api-spec) ────────────────────────────────
openapi3 {
    server = 'https://midam.store'
    title = '장인몰 (미담) API'
    description = '국가무형유산 장인 B2C 마켓플레이스 REST API'
    version = project.version
    format = 'json'
    outputDirectory = 'build/api-spec'
    outputFileNamePrefix = 'openapi'
}

// ── 후처리: example 정규화 + Actuator 경로 추가 + 문서 보강 ──────────────────
tasks.register('processOpenapi') {
    dependsOn 'openapi3'
    description = 'Post-process openapi.json: parse example values, add Actuator paths, enrich description'

    def inputFile  = file('build/api-spec/openapi.json')
    def outputFile = file('api-spec/openapi.json')

    inputs.file(inputFile)
    outputs.file(outputFile)

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def json = slurper.parse(inputFile)

        // ── 1. info.description 작성 (문의는 description 맨 아래 고정, contact 미사용) ──
        json.info.remove('contact')
        json.info.description = '''\
장인몰(미담)은 국가무형유산 장인의 작품을 직접 구매할 수 있는 B2C 마켓플레이스입니다.
본 문서는 장인몰 REST API의 공식 레퍼런스입니다.

## Quick Start

API 연동은 3단계로 시작합니다.

**1단계 — 회원가입 / 로그인**

```http
POST /api/member/signup
Content-Type: application/json

{
  "email": "buyer@example.com",
  "password": "P@ssw0rd!",
  "name": "홍길동"
}
```

**2단계 — Access Token 발급**

```http
POST /api/member/login
Content-Type: application/json

{
  "email": "buyer@example.com",
  "password": "P@ssw0rd!"
}
```

응답의 `accessToken`을 저장합니다. Refresh Token은 `Set-Cookie: refreshToken=...` 으로 전달됩니다.

**3단계 — 인증이 필요한 API 호출**

```http
GET /api/member/me
Authorization: Bearer {accessToken}
```

