// ── Postman Collection 생성 (QA팀) ───────────────────────────────────────────
abstract class BuildPostmanCollectionTask extends DefaultTask {
    @javax.inject.Inject
    abstract org.gradle.process.ExecOperations getExecOps()

    @org.gradle.api.tasks.InputFile
    abstract org.gradle.api.provider.Property<File> getSpecFile()

    @org.gradle.api.tasks.OutputFile
    abstract org.gradle.api.provider.Property<File> getOutputFile()

    @org.gradle.api.tasks.TaskAction
    void run() {
        def spec = specFile.get()
        def out  = outputFile.get()
        def result = execOps.exec {
            commandLine 'npx', '--yes', 'openapi-to-postmanv2',
                '-s', spec.absolutePath,
                '-o', out.absolutePath,
                '-O', 'folderStrategy=Tags,includeAuthInfoInExample=false,requestParametersResolution=Example'
            ignoreExitValue = true
        }
        if (result.exitValue != 0) {
            println "[buildPostmanCollection] 변환 실패 (exitValue=${result.exitValue}) — 파일 생략"
            if (out.exists()) out.delete()
        } else {
            println "[buildPostmanCollection] 생성 완료: ${out.absolutePath}"
        }
    }
}

tasks.register('buildPostmanCollection', BuildPostmanCollectionTask) {
    dependsOn 'processOpenapiPublic'
