        // ════════════════════════════════════════════════════════════════════
        // 4. summary.html — PM/기획팀 엔드포인트 요약 테이블
        // ════════════════════════════════════════════════════════════════════
        def tagMap = [:].withDefault { [] }
        json.paths?.each { String path, pathItem ->
            methods.each { method ->
                def op = pathItem[method]
                if (!op) return
                def tag = op.tags?.first() ?: '기타'
                def desc = op.description ?: ''
                def roleMatch = desc =~ /\*\*([^*\n]+)\*\*/
                def roleBadge = roleMatch ? roleMatch[0][1] : ''
                tagMap[tag] << [method: method.toUpperCase(), path: path, summary: op.summary ?: '', role: roleBadge]
            }
        }

        def rows = new StringBuilder()
        def tagOrder = json.tags?.collect { it.name } ?: tagMap.keySet().sort()
        tagOrder.each { tag ->
            def endpoints = tagMap[tag]
            if (!endpoints) return
            rows.append("\n      <tr class=\"tag-header\"><td colspan=\"4\"><strong>${tag.replace('<','&lt;')}</strong></td></tr>")
            endpoints.each { ep ->
                def color = methodColor[ep.method] ?: '#999'
                def roleHtml = ep.role ? "<span class=\"role\">${ep.role.replace('<','&lt;')}</span>" : ''
                rows.append("\n      <tr><td><span class=\"method\" style=\"background:${color}\">${ep.method}</span></td><td class=\"path\">${ep.path.replace('<','&lt;')}</td><td>${ep.summary.replace('<','&lt;').replace('"','&quot;')}</td><td>${roleHtml}</td></tr>")
            }
        }

        def totalCount = tagMap.values().sum { it.size() } ?: 0

