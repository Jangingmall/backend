    tr.tag-header td{background:#EEF2FD;font-size:13px;padding:8px 14px;color:#3D6CD4;border-bottom:2px solid #d0dafc}
    .method{display:inline-block;padding:2px 8px;border-radius:3px;color:#fff;font-weight:700;font-size:11px;min-width:54px;text-align:center}
