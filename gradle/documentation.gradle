## 문의

기술 문의: dev@midam.store
'''

        // ── 2. servers 보장 (restdocs-api-spec이 단일 url만 넣는 경우 대비) ──────
        json.servers = [
            [url: 'https://midam.store',   description: 'Production'],
            [url: 'http://localhost:8080', description: 'Local']
        ]

        // ── 2-1. request body required + constraints 주입 ───────────────────────
        // epages restdocs-api-spec은 @Valid 어노테이션을 OpenAPI 스키마 제약으로 변환하지 않는다.
        // (1) required: 스니펫 requestFields.optional=false → requestBody.schema.required[]
        // (2) constraints: Request 클래스 어노테이션 기반 테이블 → 각 property 스키마 속성 주입
        //
        // 제약 테이블 형식: operationId → { fieldPath → { maxLength, minLength, minimum, maximum, pattern, minItems } }
        // 동일 제약이 create/update 양쪽에 있을 경우 공통 맵을 재사용한다.
        def productFieldConstraints = [
            title              : [maxLength: 200],
            price              : [minimum: 1],
            stock              : [minimum: 0],
            thumbnailUrl       : [maxLength: 500],
            giftThemes         : [items: [maxLength: 50]],
            purposeTags        : [items: [maxLength: 100]],
            productionPeriodDays: [minimum: 1],
            colors             : [items: [maxLength: 20]]
        ]
        def constraintTable = [
            'product-create'      : productFieldConstraints,
            'product-update'      : productFieldConstraints,
            'notification-create-200': [
                title  : [maxLength: 255],
                content: [maxLength: 255]
            ],
            'product-review-write': [
                rating : [minimum: 1, maximum: 5],
                content: [maxLength: 2000]
            ],
            'product-qna-ask': [
                content: [maxLength: 1000]
            ],
            'product-qna-answer': [
                content: [maxLength: 2000]
            ],
            'chatbot-message-send': [
                content: [maxLength: 2000]
            ],
            'interview-create': [
                materials : [maxLength: 255],
                technique : [maxLength: 100]
            ],
            'interview-update': [
                materials : [maxLength: 255],
                technique : [maxLength: 100]
            ],
            'generation-request': [
                images     : [maxItems: 8],
                productName: [maxLength: 15]
            ],
            'signup': [
                email   : [maxLength: 255],
                password: [minLength: 8, maxLength: 72],
                name    : [maxLength: 50],
                phone   : [pattern: '\\\\d{9,20}']
            ]
        ]

        // constraint 주입: operationId 기준으로 requestBody 스키마 properties에 제약 추가
        // epages는 $ref를 사용하므로 components/schemas의 실제 스키마 properties를 수정한다.
        // (required는 epages가 이미 컴포넌트 스키마에 포함시킴)
        //
        // constraint → 한글 description 접미사 변환 규칙
        def constraintToKorean = { Map fieldConstraints ->
            def parts = []
            if (fieldConstraints.minimum != null && fieldConstraints.maximum != null) {
                parts << "${fieldConstraints.minimum} 이상 ${fieldConstraints.maximum} 이하"
            } else if (fieldConstraints.minimum != null) {
                parts << "${fieldConstraints.minimum} 이상"
            } else if (fieldConstraints.maximum != null) {
                parts << "${fieldConstraints.maximum} 이하"
            }
            if (fieldConstraints.minLength != null && fieldConstraints.maxLength != null) {
                parts << "${fieldConstraints.minLength}자 이상 ${fieldConstraints.maxLength}자 이하"
            } else if (fieldConstraints.minLength != null) {
                parts << "${fieldConstraints.minLength}자 이상"
            } else if (fieldConstraints.maxLength != null) {
                parts << "최대 ${fieldConstraints.maxLength}자"
            }
            if (fieldConstraints.maxItems != null) parts << "최대 ${fieldConstraints.maxItems}개"
            if (fieldConstraints.minItems != null) parts << "${fieldConstraints.minItems}개 이상"
            if (fieldConstraints.pattern) parts << "형식: ${fieldConstraints.pattern}"
            if (fieldConstraints.items?.maxLength) parts << "항목 최대 ${fieldConstraints.items.maxLength}자"
            parts.join(', ')
        }

        json.paths?.each { String path, pathItem ->
            ['post','put','patch'].each { method ->
                def op = pathItem[method]
                if (!op) return
                def oid = op.operationId ?: ''
                def constraints = constraintTable[oid]
                if (!constraints) return

                op.requestBody?.content?.each { contentType, mediaType ->
                    def topSchema = mediaType?.schema
                    if (!topSchema) return
                    // $ref가 있으면 컴포넌트 스키마를 직접 수정
                    def refPath = topSchema['\$ref']
                    def targetSchema = refPath
                        ? json.components?.schemas?.get(refPath.tokenize('/').last())
                        : topSchema
                    if (!targetSchema?.properties) return
                    constraints.each { String fieldName, Map fieldConstraints ->
                        def prop = targetSchema.properties[fieldName]
                        if (!prop) return

                        // 한글 description 접미사 주입
                        // 스니펫에 이미 제약 설명이 있으면(숫자 포함) 중복 추가 방지
                        def koreanSuffix = constraintToKorean(fieldConstraints)
                        if (koreanSuffix) {
                            def existing = prop.description ?: ''
                            def alreadyHasConstraint = existing =~ /\d+\s*(자|이상|이하|~)/
                            if (!alreadyHasConstraint && !existing.contains(koreanSuffix)) {
                                prop.description = existing ? "${existing} (${koreanSuffix})" : "(${koreanSuffix})"
                            }
                        }

                        fieldConstraints.each { String k, v ->
                            if (k == 'items') {
                                // 배열 아이템 제약 (e.g. List<@Size(max=50) String>)
                                if (!prop.items) {
                                    prop.items = [type: 'string']
                                    v.each { ik, iv -> prop.items[ik] = iv }
                                } else if (prop.items instanceof Map && prop.items.oneOf instanceof List) {
                                    // oneOf 구조: string 타입 항목을 찾아 교체 (다른 타입 제거, string만 남김)
                                    def strItem = prop.items.oneOf.find { it instanceof Map && it.type == 'string' }
                                    if (strItem) {
                                        v.each { ik, iv -> strItem[ik] = iv }
                                        prop.items = strItem
                                    }
                                } else {
                                    v.each { ik, iv -> prop.items[ik] = iv }
                                }
                            } else {
                                prop[k] = v
                            }
                        }
                    }
                }
            }
        }

        // ── 2-2. path parameter 타입·설명 교정 ──────────────────────────────────
        // 에러 케이스 스니펫(documentError)이 pathParameters=[]로 성공 케이스의
        // 타입·설명을 덮어쓰는 문제를 교정한다.
        // 정보는 build/generated-snippets/*/resource.json의 성공 케이스에서 파생하며
        // 파라미터 이름을 직접 관리하지 않는다.
        def pathParamMeta = [:]  // name → [type, description]
        def snippetsDir = file('build/generated-snippets')
        if (snippetsDir.exists()) {
            snippetsDir.eachDir { dir ->
                def resourceFile = new File(dir, 'resource.json')
                if (!resourceFile.exists()) return
                def snippet = slurper.parse(resourceFile)
                snippet?.request?.pathParameters?.each { p ->
                    if (p.name && p.type && !pathParamMeta.containsKey(p.name)) {
                        def schemaType = p.type.toString().toLowerCase() == 'integer' ? 'integer'
                            : p.type.toString().toLowerCase() == 'number'  ? 'number'
                            : 'string'
                        def schemaFormat = schemaType == 'integer' ? 'int64' : null
                        pathParamMeta[p.name] = [
                            type       : schemaType,
                            format     : schemaFormat,
                            description: p.description ?: ''
                        ]
                    }
                }
            }
        }
        json.paths?.each { String path, pathItem ->
            ['get','post','put','patch','delete','head','options'].each { method ->
                def op = pathItem[method]
                if (!op) return
                op.parameters?.each { param ->
                    if (param.in == 'path') {
                        def meta = pathParamMeta[param.name]
                        if (meta) {
                            param.schema = param.schema ?: [:]
                            param.schema.type = meta.type
                            if (meta.format) param.schema.format = meta.format
                            else param.schema.remove('format')
                            if (!param.description) param.description = meta.description
                        }
                    }
                }
            }
        }

        // ── 3. example value 문자열 → JSON 객체 파싱 ───────────────────────────
        def parseExampleValue = { Map example ->
            def val = example['value']
            if (val instanceof String) {
                try {
                    example['value'] = slurper.parseText(val)
                } catch (ignored) {
                    // intentionally invalid JSON (REQUEST_BODY_MALFORMED 케이스) — leave as-is
                }
            }
        }

        def walkExamples = { Map operation ->
            operation?.requestBody?.content?.each { contentType, mediaType ->
                mediaType?.examples?.each { name, example -> parseExampleValue(example) }
            }
            operation?.responses?.each { status, response ->
                response?.content?.each { contentType, mediaType ->
                    mediaType?.examples?.each { name, example -> parseExampleValue(example) }
                }
            }
        }

        json.paths?.each { path, pathItem ->
            ['get','post','put','patch','delete','head','options'].each { method ->
                if (pathItem[method]) walkExamples(pathItem[method])
            }
        }

        // ── 4. securitySchemes + 전역 security 주입 ─────────────────────────────
        if (!json.components) json.components = [:]
        json.components.securitySchemes = [
            bearerAuth: [
                type        : 'http',
                scheme      : 'bearer',
                bearerFormat: 'JWT',
                description : 'POST /api/member/login 응답의 accessToken을 입력하세요.'
            ]
        ]
        // 전역 기본값: 모든 operation이 JWT 필요로 시작 (PUBLIC은 아래에서 security: [] 오버라이드)
        json.security = [[bearerAuth: []]]

        // ── 4-1. ApiErrorResponse 컴포넌트 스키마 (공통 에러 형식 참조용) ────────
        if (!json.components.schemas) json.components.schemas = [:]
        json.components.schemas['ApiErrorResponse'] = [
            type      : 'object',
            description: '모든 에러 응답의 공통 형식. 에러 코드 목록은 상단 Overview를 참조하세요.',
            properties: [
                success  : [type: 'boolean', example: false],
                status   : [type: 'integer', example: 400],
                errorCode: [type: 'string',  example: 'INVALID_INPUT'],
                message  : [type: 'string',  example: '입력값이 올바르지 않습니다']
            ],
            example: [
                success  : false,
                status   : 400,
                errorCode: 'INVALID_INPUT',
                message  : '입력값이 올바르지 않습니다'
            ]
        ]

        // ── 5. 로컬 전용 Dev 경로 추가 ──────────────────────────────────────────
        json.paths['/dev/token'] = [
            post: [
                tags       : ['Dev (로컬 전용)'],
                summary    : '개발용 토큰 즉시 발급',
                description: '🚧 **local / local-postgresql 프로파일에서만 동작합니다.**\n\n회원가입·승인 없이 role을 지정해 JWT를 즉시 발급합니다. AI팀 로컬 연동 테스트용.\n\n> **만료 시간: 7일** — 일반 accessToken(30분)과 달리 장기 토큰을 발급합니다. 재발급 없이 일주일간 사용 가능합니다.\n\n발급한 토큰을 Authorization 헤더에 담아 사용합니다.\n```http\nAuthorization: Bearer {accessToken}\n```\n\n| role | memberId | 용도 |\n|------|----------|------|\n| `ARTISAN` | -1 | 콘텐츠 생성, 상품 등록/수정/삭제 |\n| `USER` | -3 | 챗봇, 찜, 알림, 문의 |\n| `ADMIN` | -2 | 관리자 기능 |\n\n> memberId가 음수이므로 실제 DB 회원 조회가 필요한 엔드포인트는 404가 발생할 수 있습니다.',
                operationId: 'dev-token',
                security   : [],
                parameters : [
                    [
                        name    : 'role',
                        in      : 'query',
                        required: false,
                        schema  : [type: 'string', enum: ['ARTISAN', 'USER', 'ADMIN'], default: 'ARTISAN'],
                        description: '발급할 토큰의 권한'
                    ]
                ],
                responses  : [
                    '200': [
                        description: '토큰 발급 성공',
                        content    : [
                            'application/json': [
                                schema  : [
                                    type      : 'object',
                                    properties: [
                                        success: [type: 'boolean', example: true],
                                        status : [type: 'integer', example: 200],
                                        data   : [
                                            type      : 'object',
                                            properties: [
                                                accessToken: [type: 'string', description: 'Authorization: Bearer <token> 헤더에 사용', example: 'eyJhbGciOiJIUzI1NiJ9...'],
                                                role       : [type: 'string', enum: ['USER', 'ARTISAN', 'ADMIN'], example: 'ARTISAN'],
                                                memberId   : [type: 'integer', description: '음수 ID — 실제 DB 회원 없음', example: -1]
                                            ]
                                        ]
                                    ]
                                ],
                                examples: [
                                    ARTISAN: [
                                        summary: 'ARTISAN 토큰',
                                        value  : [success: true, status: 200, data: [accessToken: 'eyJhbGciOiJIUzI1NiJ9...', role: 'ARTISAN', memberId: -1]]
                                    ],
                                    USER: [
                                        summary: 'USER 토큰',
                                        value  : [success: true, status: 200, data: [accessToken: 'eyJhbGciOiJIUzI1NiJ9...', role: 'USER', memberId: -3]]
                                    ]
                                ]
                            ]
                        ]
                    ]
                ]
            ]
        ]

        // ── 5-1. Actuator / 인프라 헬스 경로 추가 ───────────────────────────────
        if (!json.paths) json.paths = [:]

        json.paths['/healthz'] = [
            get: [
                tags       : ['인프라'],
                summary    : 'ALB 헬스체크',
                description: 'Application Load Balancer가 호출하는 ping 헬스체크 엔드포인트. 포트 8080. 인증 불필요.',
                operationId: 'healthz-ping',
                responses  : [
                    '200': [
                        description: 'OK',
                        content    : [
                            'application/json': [
                                schema  : [type: 'object', properties: [status: [type: 'string', example: 'UP']]],
                                examples: [UP: [value: [status: 'UP']]]
                            ]
                        ]
                    ]
                ]
            ]
        ]

        json.paths['/actuator/health/liveness'] = [
            get: [
                tags       : ['인프라'],
                summary    : 'K8s Liveness Probe',
                description: 'Kubernetes liveness probe. 포트 9090. 실패 시 컨테이너 재시작.',
                operationId: 'actuator-health-liveness',
                responses  : [
                    '200': [description: 'Alive', content: ['application/json': [schema: [type: 'object'], examples: [UP: [value: [status: 'UP']]]]]],
                    '503': [description: 'Not alive']
                ]
            ]
        ]

        json.paths['/actuator/health/readiness'] = [
            get: [
                tags       : ['인프라'],
                summary    : 'K8s Readiness Probe',
                description: 'Kubernetes readiness probe. 포트 9090. 실패 시 트래픽 차단.',
                operationId: 'actuator-health-readiness',
                responses  : [
                    '200': [description: 'Ready',    content: ['application/json': [schema: [type: 'object'], examples: [UP: [value: [status: 'UP', components: [db: [status: 'UP'], redis: [status: 'UP']]]]]]]],
                    '503': [description: 'Not ready']
                ]
            ]
        ]

        json.paths['/actuator/prometheus'] = [
            get: [
                tags       : ['인프라'],
                summary    : 'Prometheus 메트릭',
                description: 'Prometheus 스크레이핑용 메트릭 엔드포인트. 포트 9090. 내부 네트워크 전용.',
                operationId: 'actuator-prometheus',
                responses  : [
                    '200': [description: 'Prometheus text format', content: ['text/plain': [schema: [type: 'string']]]]
                ]
            ]
        ]

        // ── 6. x-sample-data 주입 ──────────────────────────────────────────────
        json['x-sample-data'] = [
            member : [email: 'artisan@example.com', name: '김도공'],
            product: [title: '청자 상감 다완', price: 85000, category: 'POTTERY'],
            chatbot: [message: '어머니 생신 선물 추천해줘', sessionKey: 'sess-abc123']
        ]

        // ── 6-1. 엔드포인트별 필요 권한 description 배지 주입 ─────────────────
        // MemberRole: USER < ARTISAN(USER+ARTISAN) < ADMIN(USER+ADMIN)
        // PUBLIC: 인증 불필요 (PermitAllPaths 또는 SecurityConfig permitAll)
        def roleLabels = [
            PUBLIC : '🔓 **인증 불필요**',
            USER   : '🔑 **USER** 이상',
            ARTISAN: '🛠 **ARTISAN** (판매자)',
            ADMIN  : '🔐 **ADMIN** (관리자)',
        ]
        // operationId prefix/exact → role
        def roleByOperationId = [
            // 로컬 전용
            'dev-token'                 : 'PUBLIC',
            // 공개 (인증 불필요)
            'healthz-ping'              : 'PUBLIC',
            'actuator-health-liveness'  : 'PUBLIC',
            'actuator-health-readiness' : 'PUBLIC',
            'actuator-prometheus'       : 'PUBLIC',
            'product-list'              : 'PUBLIC',
            'product-detail'            : 'PUBLIC',
            'category-list'             : 'PUBLIC',
            'category-main-list'        : 'PUBLIC',
            'subcategory-list'          : 'PUBLIC',
            'material-list'             : 'PUBLIC',
            'product-qna-list'          : 'PUBLIC',
            'product-review-list'       : 'PUBLIC',
            // chatbot — PermitAllPaths: /api/chatbot/**
            'chatbot-session-create'    : 'PUBLIC',
            'chatbot-session-end'       : 'PUBLIC',
            'chatbot-message-send'      : 'PUBLIC',
            'chatbot-message-list'      : 'PUBLIC',
            // USER 권한
            'member-wish-list'          : 'USER',
            'member-subscribe'          : 'USER',
            'member-unsubscribe'        : 'USER',
            'member-subscriptions'      : 'USER',
            'member-notifications'      : 'USER',
            'product-wish'              : 'USER',
            'product-unwish'            : 'USER',
            'product-qna-ask'           : 'USER',
            'product-review-write'      : 'USER',
            // 알림 — USER
            'notification-stream-200'      : 'USER',
            'notification-create-200'      : 'USER',
            'notification-list-200'        : 'USER',
            'notification-unread-count-200': 'USER',
            'notification-read-all-200'    : 'USER',
            'notification-get-one-'        : 'USER',
            'notification-read-'           : 'USER',
            'notification-delete-'         : 'USER',
            // ARTISAN 권한
            'product-create'            : 'ARTISAN',
            'product-my-list'           : 'ARTISAN',
            'product-update'            : 'ARTISAN',
            'product-change-status'     : 'ARTISAN',
            'product-delete'            : 'ARTISAN',
            'product-qna-answer'        : 'ARTISAN',
            'content-get'               : 'ARTISAN',
            'content-version-history'   : 'ARTISAN',
            'content-bulk-update'       : 'ARTISAN',
            'content-block-update'      : 'ARTISAN',
            'content-approve'           : 'ARTISAN',
            'content-reject'            : 'ARTISAN',
            'content-submit'            : 'ARTISAN',
            'content-publish'           : 'ARTISAN',
            'generation-request'        : 'ARTISAN',
            'generation-poll-'          : 'ARTISAN',
            'interview-find'            : 'ARTISAN',
            'interview-create'          : 'ARTISAN',
            'interview-update'          : 'ARTISAN',
            // ADMIN 권한
            'seller-application-admin-' : 'ADMIN',
            'seller-application-approve': 'ADMIN',
            'seller-application-reject' : 'ADMIN',
            'seller-application-pipeline-update': 'ADMIN',
            'image-verify'              : 'ADMIN',
        ]

        def resolveRole = { String oid ->
            // exact match first, then prefix match
            def role = roleByOperationId[oid]
            if (!role) {
                role = roleByOperationId.find { k, v -> oid.startsWith(k) }?.value
            }
            role ?: 'USER' // authenticated() fallback
        }

        json.paths?.each { path, pathItem ->
            ['get','post','put','patch','delete','head','options'].each { method ->
                def op = pathItem[method]
                if (!op) return
                def oid = op.operationId ?: ''
                def role = resolveRole(oid)
                def badge = roleLabels[role] ?: roleLabels['USER']
                def existing = op.description ?: ''
                op.description = "${badge}\n\n${existing}".trim()
                op['x-required-role'] = role
                // PUBLIC: security 빈 배열로 오버라이드 → Redocly "No auth required" 표시
                if (role == 'PUBLIC') op.security = []
            }
        }

        // ── 7. 태그 정렬 (aA-zZ, ㄱ-ㅎ 가나다순) ──────────────────────────────
        def allTags = [] as Set
        json.paths?.each { path, pathItem ->
            ['get','post','put','patch','delete','head','options'].each { method ->
                pathItem[method]?.tags?.each { allTags << it }
            }
        }
        def collator = java.text.Collator.getInstance(java.util.Locale.KOREAN)
        collator.strength = java.text.Collator.PRIMARY
        json.tags = allTags
            .sort { a, b -> collator.compare(a, b) }
            .sort { it == '인프라' ? 1 : 0 }
            .collect { [name: it] }

        // ── 8. x-tagGroups 자동 추론 ────────────────────────────────────────────
        // 태그명 키워드 규칙으로 그룹을 추론한다. 별도 설정 파일·어노테이션 없음.
        // 새 태그 추가 시 키워드 규칙에 자동으로 매핑되며, 규칙에 맞지 않으면 '기타'에 포함된다.
        def tagGroupRules = [
            // [order, groupName, matchKeywords(태그에 포함되면 이 그룹으로 분류)]
            [1,  '회원/장인', ['회원', '장인', '소셜', '판매자', '로그인', '구독']],
            [2,  '주문/결제', ['결제', '장바구니', '주문', '배송', '반품', '교환', '환불']],
            [3,  '상품',     ['상품', '카테고리', '문의', '후기', '리뷰', '찜', '재료']],
            [4,  '콘텐츠',   ['콘텐츠', '생성', '콜백', '인터뷰', '블록']],
            [5,  '챗봇',     ['챗봇', '채팅']],
            [6,  '미디어',   ['이미지', '미디어', '파일']],
            [7,  '알림',     ['알림', '노티']],
            [8,  '관리자',   ['관리자', 'admin', 'Admin']],
            [90, 'Dev (로컬 전용)', ['Dev', '로컬']],
            [99, '인프라',   ['인프라', 'actuator', 'Actuator', 'healthz']]
        ]

        def resolveGroup = { String tag ->
            for (rule in tagGroupRules) {
                def keywords = rule[2] as List
                if (keywords.any { kw -> tag.contains(kw) }) {
                    return [order: rule[0] as int, name: rule[1] as String]
                }
            }
            return [order: 89, name: '기타']
        }

        def tagGroupsMap = [:]  // groupName → [order: int, tags: List]
        allTags.each { tag ->
            def resolved = resolveGroup(tag)
            def groupName = resolved.name
            if (!tagGroupsMap.containsKey(groupName)) {
                tagGroupsMap[groupName] = [order: resolved.order, tags: []]
            }
            tagGroupsMap[groupName].tags << tag
        }

        def tagGroupsList = tagGroupsMap
            .sort { a, b -> a.value.order <=> b.value.order }
            .collect { groupName, meta ->
                [name: groupName, tags: meta.tags.sort { a, b -> collator.compare(a, b) }]
            }
        if (tagGroupsList) {
            json['x-tagGroups'] = tagGroupsList
        }

        def outputDir = file('api-spec')
        outputDir.mkdirs()
        outputFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(json)
        )

        println "[processOpenapi] 생성 완료: ${outputFile.absolutePath}"
    }
}

// ── 공개 배포용 OpenAPI 후처리 (이력서/포트폴리오 GitHub Pages) ──────────────
// 제거 대상: /dev/token, /actuator/**, /healthz, ADMIN 전용 엔드포인트, x-sample-data
tasks.register('processOpenapiPublic') {
    dependsOn 'processOpenapi'
    description = 'Generate public openapi.json for GitHub Pages (removes internal/admin paths)'

    def inputFile  = file('api-spec/openapi.json')
    def outputFile = file('api-spec/public/openapi.json')

    inputs.file(inputFile)
    outputs.file(outputFile)

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def json    = slurper.parse(inputFile)

        // ── 제거할 경로 prefix / exact ────────────────────────────────────────
        def removePaths = { String path ->
            path.startsWith('/dev/')       ||
            path.startsWith('/actuator/')  ||
            path == '/healthz'
        }

        // ── ADMIN 전용 operationId prefix ─────────────────────────────────────
        def adminPrefixes = [
            'seller-application-admin-',
            'seller-application-approve',
            'seller-application-reject',
            'seller-application-pipeline-update',
            'image-verify',
        ]
        def isAdminOnly = { String oid ->
            adminPrefixes.any { prefix -> oid == prefix || oid.startsWith(prefix) }
        }

        // 경로 필터링
        def filteredPaths = json.paths?.findAll { path, pathItem ->
            if (removePaths(path)) return false
            // 해당 경로의 모든 메서드가 ADMIN 전용이면 제거
            def methods = ['get','post','put','patch','delete','head','options']
            def nonAdminExists = methods.any { m ->
                def op = pathItem[m]
                op && !isAdminOnly(op.operationId ?: '')
            }
            nonAdminExists
        }

        // 각 경로 안에서도 ADMIN 전용 메서드 제거
        filteredPaths.each { path, pathItem ->
            ['get','post','put','patch','delete','head','options'].each { m ->
                def op = pathItem[m]
                if (op && isAdminOnly(op.operationId ?: '')) pathItem.remove(m)
            }
        }

        json.paths = filteredPaths

        // x-sample-data 제거 (내부 테스트 데이터)
        json.remove('x-sample-data')

        // info.description 문의 이메일 교체 + 다른 형식 링크 추가
        if (json.info?.description) {
            json.info.description = json.info.description
                .replace('기술 문의: dev@midam.store', '기술 문의: GitHub Issues')
            json.info.description += '''

---

## 다른 형식으로 보기

| 형식 | 대상 | 링크 |
|------|------|------|
| Redoc 문서 | 모든 팀 | [jangingmall.github.io/backend/](https://jangingmall.github.io/backend/) |
| OpenAPI JSON | 개발자 | [openapi.json](./openapi.json) |
| Postman Collection | QA 팀 | [postman.json](./postman.json) |
| TypeScript 타입 | FE 팀 | [types.d.ts](./types.d.ts) |
| API 요약 | PM/기획 | [summary.html](./summary.html) |
'''
        }

        // 태그에서 'Dev (로컬 전용)', '인프라', '관리자' 제거
        def removeTags = ['Dev (로컬 전용)', '인프라', '관리자'] as Set
        if (json.tags) {
            json.tags = json.tags.findAll { !(it.name in removeTags) }
        }
        if (json['x-tagGroups']) {
            json['x-tagGroups'] = json['x-tagGroups']
                .findAll { !(it.name in ['Dev (로컬 전용)', '인프라', '관리자']) }
                .collect { group ->
                    group.tags = group.tags?.findAll { !(it in removeTags) }
                    group
                }
                .findAll { group -> group.tags }
        }

        def outputDir = file('api-spec/public')
        outputDir.mkdirs()
        outputFile.text = groovy.json.JsonOutput.prettyPrint(
            groovy.json.JsonOutput.toJson(json)
        )
        println "[processOpenapiPublic] 생성 완료: ${outputFile.absolutePath}"
    }
}

