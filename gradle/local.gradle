tasks.register('stopServer') {
    group = 'application'
    description = '8080 포트를 점유한 프로세스를 종료합니다'
    doLast {
        def pid = ['sh', '-c', "lsof -ti:8080"].execute().text.trim()
        if (pid) {
            println "서버 종료 중 (PID: ${pid})"
            ['kill', pid].execute().waitFor()
            println "완료"
        } else {
            println "8080 포트에 실행 중인 프로세스가 없습니다"
        }
    }
}
