global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "backend-local"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          env: "local"

  - job_name: "backend-prod"
    metrics_path: "/actuator/prometheus"
    scheme: https
    static_configs:
      - targets: ["api.midam.store"]
        labels:
          env: "prod"
