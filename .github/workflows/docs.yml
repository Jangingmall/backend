name: API Docs (GitHub Pages)

on:
  push:
    branches: [ develop ]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build public docs from committed openapi.json
        run: ./gradlew processOpenapiPublic buildRedoclyPublic --no-daemon

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./api-spec/public
          publish_branch: gh-pages
          commit_message: "docs: update API docs from ${{ github.sha }}"
