name: API Docs (GitHub Pages)

on:
  push:
    branches: [ develop, feat/qa-automation-package ]  # TEMP: 페이지 검증용 — 완료 후 제거

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests & generate OpenAPI spec
        run: ./gradlew test processOpenapi --no-daemon --build-cache

      - name: Build all public artifacts
        run: ./gradlew processOpenapiPublic buildRedoclyPublic buildPostmanCollection buildTypeScriptTypes buildApiSummaryHtml buildQaPackage --no-daemon --continue
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./api-spec/public
          publish_branch: gh-pages
          commit_message: "docs: update API docs from ${{ github.sha }}"

      # TEMP: 페이지 정상 여부 검증 — 완료 후 제거
      - name: Wait for GitHub Pages to propagate
        run: sleep 30

      - name: Verify deployed pages (no 404)
        run: |
          BASE="https://jangingmall.github.io/backend"
          PAGES="/ /hub.html /summary.html /postman.html /types.html /openapi.json /postman.json /types.d.ts /qa/ /qa/index.html /qa/A_api_inventory.csv /qa/B_test_case_matrix.csv /qa/C_negative_test_matrix.csv /qa/D_auth_matrix.csv /qa/I_contract_test_matrix.csv"
          FAILED=0
          for page in $PAGES; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$page")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $BASE$page → $STATUS"
            else
              echo "❌ $BASE$page → $STATUS"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ $FAILED -gt 0 ]; then
            echo "::error::${FAILED}개 페이지 비정상 응답"
            exit 1
          fi
