name: CD

on:
  push:
    branches: [ develop ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.resolve.outputs.digest }}
      image-uri: ${{ steps.meta.outputs.image-uri }}

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --build-cache

      - name: Build JAR and extract layers
        run: |
          ./gradlew bootJar --no-daemon --build-cache -x test
          java -Djarmode=layertools -jar build/libs/*.jar extract --destination build/extracted

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="staging-${SHORT_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image-uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "ecr-registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT

      - name: Check if image already exists in ECR
        id: ecr-check
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="${{ steps.meta.outputs.image-tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || echo "")
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "digest=" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.ecr-check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        id: push
        if: steps.ecr-check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          push: true
          build-args: EXTRACTED=build/extracted
          tags: ${{ steps.meta.outputs.image-uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve final digest
        id: resolve
        run: |
          if [ "${{ steps.ecr-check.outputs.exists }}" == "true" ]; then
            echo "digest=${{ steps.ecr-check.outputs.digest }}" >> $GITHUB_OUTPUT
            echo "Reusing existing image: ${{ steps.meta.outputs.image-uri }}"
            echo "Digest: ${{ steps.ecr-check.outputs.digest }}"
          else
            echo "digest=${{ steps.push.outputs.digest }}" >> $GITHUB_OUTPUT
            echo "Pushed new image: ${{ steps.meta.outputs.image-uri }}"
            echo "Digest: ${{ steps.push.outputs.digest }}"
          fi
