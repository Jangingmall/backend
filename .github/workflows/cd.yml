name: CD

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: jangin-app
  AWS_ROLE_ARN: arn:aws:iam::750240012008:role/jangin-gha-backend-ci

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.resolve.outputs.digest }}
      image-uri: ${{ steps.meta.outputs.image-uri }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --build-cache

      - name: Build JAR and extract layers
        run: |
          ./gradlew bootJar --no-daemon --build-cache -x test
          java -Djarmode=layertools -jar build/libs/*.jar extract --destination build/extracted

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="sha-${{ github.sha }}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image-uri=${IMAGE_URI}" >> ${GITHUB_OUTPUT}
          echo "image-tag=${IMAGE_TAG}" >> ${GITHUB_OUTPUT}
          echo "ecr-registry=${ECR_REGISTRY}" >> ${GITHUB_OUTPUT}

      - name: Check if image already exists in ECR
        id: ecr-check
        run: |
          set +e
          RESULT=$(aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${{ steps.meta.outputs.image-tag }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>&1)
          STATUS=$?
          set -e

          if [ "${STATUS}" -eq 0 ] && [ -n "${RESULT}" ] && [ "${RESULT}" != "None" ]; then
            echo "exists=true" >> ${GITHUB_OUTPUT}
            echo "digest=${RESULT}" >> ${GITHUB_OUTPUT}
          elif [ "${STATUS}" -ne 0 ] && echo "${RESULT}" | grep -q 'ImageNotFoundException'; then
            echo "exists=false" >> ${GITHUB_OUTPUT}
            echo "digest=" >> ${GITHUB_OUTPUT}
          else
            echo "${RESULT}" >&2
            exit "${STATUS}"
          fi

      - name: Set up Docker Buildx
        if: steps.ecr-check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        id: push
        if: steps.ecr-check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          push: true
          build-args: EXTRACTED=build/extracted
          tags: ${{ steps.meta.outputs.image-uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve final digest
        id: resolve
        run: |
          if [ "${{ steps.ecr-check.outputs.exists }}" == "true" ]; then
            echo "digest=${{ steps.ecr-check.outputs.digest }}" >> ${GITHUB_OUTPUT}
            echo "Reusing existing image: ${{ steps.meta.outputs.image-uri }}"
            echo "Digest: ${{ steps.ecr-check.outputs.digest }}"
          else
            echo "digest=${{ steps.push.outputs.digest }}" >> ${GITHUB_OUTPUT}
            echo "Pushed new image: ${{ steps.meta.outputs.image-uri }}"
            echo "Digest: ${{ steps.push.outputs.digest }}"
          fi
