name: CD

on:
  push:
    branches: [ 'release/**' ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: jangin-app
  S3_BUCKET: ${{ secrets.S3_DEPLOY_BUCKET }}
  REPO_DIR: /opt/backend

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.meta.outputs.image-uri }}
      ecr-registry: ${{ steps.meta.outputs.ecr-registry }}
      has-instance: ${{ steps.check.outputs.has-instance }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR and extract layers
        run: |
          ./gradlew bootJar --no-daemon --build-cache -x test
          java -Djarmode=layertools -jar build/libs/*.jar extract --destination build/extracted

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:staging-${SHORT_SHA}"
          echo "image-uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "ecr-registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          push: true
          build-args: EXTRACTED=build/extracted
          tags: |
            ${{ steps.meta.outputs.image-uri }}
            ${{ steps.meta.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload deploy scripts and monitoring config to S3
        run: |
          aws s3 sync scripts/    s3://${S3_BUCKET}/deploy/scripts/    --delete
          aws s3 sync monitoring/ s3://${S3_BUCKET}/deploy/monitoring/  --delete

      - name: Check EC2 instance availability
        id: check
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          if [[ -n "${EC2_INSTANCE_ID}" ]]; then
            echo "has-instance=true" >> $GITHUB_OUTPUT
          else
            echo "has-instance=false" >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ needs.build-and-push.outputs.has-instance == 'true' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM Run Command
        id: ssm
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
          ECR_REGISTRY: ${{ needs.build-and-push.outputs.ecr-registry }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 \
            --parameters "commands=[
              'aws s3 sync s3://${{ env.S3_BUCKET }}/deploy/ ${{ env.REPO_DIR }}/ --delete',
              'chmod +x ${{ env.REPO_DIR }}/scripts/deploy.sh',
              'bash ${{ env.REPO_DIR }}/scripts/deploy.sh \"${IMAGE_URI}\" \"${ECR_REGISTRY}\" \"${{ env.AWS_REGION }}\" \"${{ env.REPO_DIR }}\"'
            ]" \
            --comment "Deploy ${IMAGE_URI}" \
            --query "Command.CommandId" \
            --output text)
          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT

      - name: Wait for deployment to complete
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command-id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      - name: Check deployment result
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command-id }}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)
          if [ "$STATUS" = "Success" ]; then
            echo "배포 성공"
          else
            echo "배포 실패: $STATUS"
            aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command-id }}" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StandardErrorContent" --output text
            exit 1
          fi
