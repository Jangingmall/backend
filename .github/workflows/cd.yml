name: CD

on:
  push:
    branches: [ develop ]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-uri: ${{ steps.meta.outputs.image-uri }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --build-cache

      - name: Build JAR and extract layers
        run: |
          ./gradlew bootJar --no-daemon --build-cache -x test
          java -Djarmode=layertools -jar build/libs/*.jar extract --destination build/extracted

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:staging-${SHORT_SHA}"
          echo "image-uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "ecr-registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          push: true
          build-args: EXTRACTED=build/extracted
          tags: |
            ${{ steps.meta.outputs.image-uri }}
            ${{ steps.meta.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: |
          echo "Image URI : ${{ steps.meta.outputs.image-uri }}"
          echo "Digest    : ${{ steps.push.outputs.digest }}"
          echo "Full ref  : ${{ steps.meta.outputs.ecr-registry }}/${{ env.ECR_REPOSITORY }}@${{ steps.push.outputs.digest }}"
