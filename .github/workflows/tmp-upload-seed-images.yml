# 임시 워크플로 — 시연용 소분류 일러스트(docs/seed-images) 56장을 STG 이미지 서버(img.stg.midam.store)에 올린다.
# 업로드가 끝나면 이 파일과 scripts/demo-images/ 는 develop 에 넣지 않는다.
name: tmp-upload-seed-images

on:
  push:
    branches: [tmp/seed-image-upload]
    paths:
      - ".github/workflows/tmp-upload-seed-images.yml"
      - "scripts/demo-images/**"
      - "docs/demo-images/**"

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: 필요한 설정 확인
        env:
          TEST_HOST: ${{ secrets.test_host }}
          TEST_TOKEN: ${{ secrets.test_token }}
        run: |
          missing=""
          [ -z "$TEST_HOST" ] && missing="$missing secrets.test_host"
          [ -z "$TEST_TOKEN" ] && missing="$missing secrets.test_token"
          if [ -n "$missing" ]; then
            echo "::error::저장소 Secret 이 필요합니다:$missing (test_token 은 30분 유효한 장인 액세스 토큰)"
            exit 1
          fi

      - name: 한글 글꼴 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 시연 상품 일러스트를 CI 에서 직접 그린다 (합죽선 9장 · 청자/분청 찻잔 6장)
        run: python3 scripts/demo-images/draw_demo_products.py

      - name: Flow 1 합죽선 일러스트 업로드 (장인 액세스 토큰 → 이미지 API → 비공개 보관 상품에 연결)
        env:
          DEMO_API_BASE_URL: ${{ secrets.test_host }}
          DEMO_AGENT_TOKEN: ${{ secrets.test_token }}
          DEMO_IMAGE_BASE_URL: ${{ vars.DEMO_IMAGE_BASE_URL || 'https://img.stg.midam.store' }}
        run: |
          python3 scripts/demo-images/upload_demo_images.py \
            --src docs/demo-images/hapjukseon-maehwa-illustrated \
            --similar-distance -1 \
            --create-holder-product "[시연 이미지 보관함] 합죽선 일러스트 - 공개·삭제 금지" \
            --out seed-manifest.json

      - name: Flow 2 청자·분청 찻잔 일러스트 업로드
        if: always()
        env:
          DEMO_API_BASE_URL: ${{ secrets.test_host }}
          DEMO_AGENT_TOKEN: ${{ secrets.test_token }}
          DEMO_IMAGE_BASE_URL: ${{ vars.DEMO_IMAGE_BASE_URL || 'https://img.stg.midam.store' }}
        run: |
          python3 scripts/demo-images/upload_demo_images.py \
            --src docs/demo-images/cheongja-bunjeong-teacup \
            --similar-distance -1 \
            --create-holder-product "[시연 이미지 보관함] 청자·분청 찻잔 일러스트 - 공개·삭제 금지" \
            --out tea-manifest.json

      - name: 소분류 번호 ↔ 이미지 주소 표
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os
          for label, path in (("FLOW1", "seed-manifest.json"), ("FLOW2", "tea-manifest.json")):
              if not os.path.exists(path):
                  continue
              d = json.load(open(path))
              print(f"{label}_MAP_BEGIN")
              for e in d["images"]:
                  u = (e.get("urls") or {}).get("1280w", "")
                  print(f"{e['name']}\t{e.get('imageId')}\t{u}")
              print(f"{label}_MAP_END")
              print(label, "attach:", d.get("attach"))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-image-manifest
          path: |
            seed-manifest.json
            tea-manifest.json
          if-no-files-found: ignore
