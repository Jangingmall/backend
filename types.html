<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <title>TypeScript 타입 — 장인몰 API</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;background:#f7f8fa;color:#333}
    nav{background:#3D6CD4;padding:10px 24px;display:flex;gap:16px;flex-wrap:wrap}
    nav a{color:rgba(255,255,255,.85);text-decoration:none;font-size:13px;padding:4px 0}
    nav a:hover{color:#fff}
    .container{max-width:960px;margin:0 auto;padding:32px 24px}
    h1{color:#3D6CD4;margin:0 0 6px}
    .meta{color:#888;font-size:13px;margin-bottom:28px}
    .btn{display:inline-block;padding:10px 22px;background:#3D6CD4;color:#fff;text-decoration:none;border-radius:6px;font-size:14px;font-weight:600;margin-right:10px;margin-bottom:8px}
    .btn:hover{background:#2d56bb}
    .btn.secondary{background:#fff;color:#3D6CD4;border:2px solid #3D6CD4;cursor:pointer}
    .btn.secondary:hover{background:#EEF2FD}
    .tip{background:#EEF2FD;border-left:3px solid #3D6CD4;padding:12px 16px;border-radius:0 6px 6px 0;font-size:13px;margin:20px 0;color:#555}
    .toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
    pre{background:#1e1e2e;color:#cdd6f4;border-radius:8px;padding:20px;overflow:auto;font-size:13px;line-height:1.6;max-height:70vh;margin:0}
    .kw{color:#cba6f7}.ty{color:#89b4fa}.cm{color:#6c7086;font-style:italic}.st{color:#a6e3a1}
  </style>
</head>
<body>
<nav>
  <a href="./">API 문서</a>
  <a href="./hub.html">팀별 허브</a>
  <a href="./summary.html">API 요약</a>
  <a href="./postman.html">Postman</a>
  <a href="./types.html">TypeScript</a>
</nav>
<div class="container">
  <h1>TypeScript 타입 정의</h1>
  <div class="meta">FE 팀 · 장인몰 (미담) API v0.0.1-SNAPSHOT · 2026-09-23 02:52 UTC</div>

  <div class="tip">OpenAPI 스펙에서 자동 생성된 타입입니다. <code>types.d.ts</code>를 프로젝트에 복사하거나 다운로드하세요.</div>

  <div class="toolbar">
    <a class="btn" href="./types.d.ts" download="types.d.ts">⬇ types.d.ts 다운로드</a>
    <button class="btn secondary" onclick="copyCode()">복사</button>
  </div>
  <pre id="code">// types.d.ts is generated on CI deploy — run ./gradlew buildTypeScriptTypes locally to preview</pre>
</div>
<script>
function copyCode(){
  navigator.clipboard.writeText(document.getElementById('code').innerText)
    .then(function(){alert('복사 완료!')})
    .catch(function(){alert('복사 실패 — 직접 선택 후 Ctrl+C')})
}
</script>
</body>
</html>
